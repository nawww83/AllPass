<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="AllPass">
  <title>AllPass</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E4E79"/>
      <stop offset="1" stop-color="#0B2133"/>
    </linearGradient>

    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#000810" flood-opacity="0.40"/>
    </filter>

    <!-- замок: белая заливка, скважина вырезана до фона -->
    <mask id="lock" maskUnits="userSpaceOnUse" x="0" y="0" width="256" height="256">
      <g fill="#fff" stroke="none">
        <rect x="55.04" y="119.81" width="145.92" height="90.62" rx="15.87"/>
      </g>
      <path d="M80.64 135 V119.81 A47.36 47.36 0 0 1 175.36 119.81 V135"
            fill="none" stroke="#fff" stroke-width="20.48"/>
      <g fill="#000">
        <circle cx="128" cy="160.8" r="12.3"/>
        <polygon points="120.3,160.8 135.7,160.8 139.5,189.9 116.5,189.9"/>
        <circle cx="128" cy="189.9" r="11.5"/>
      </g>
    </mask>
  </defs>

  <rect width="256" height="256" rx="57.6" fill="url(#bg)"/>
  <rect width="256" height="256" rx="57.6" fill="#ECF6FF" mask="url(#lock)" filter="url(#drop)"/>
  <rect x="1.4" y="1.4" width="253.2" height="253.2" rx="56.2"
        fill="none" stroke="#fff" stroke-opacity="0.27" stroke-width="2.8"/>
</svg>
